name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "story/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - run: npm ci
      - run: uv sync --project services/api --frozen
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: uvx pip-audit==2.10.1 --path services/api/.venv/lib/python3.13/site-packages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Build production containers
        run: |
          docker build -t over-nerv-block-api:${GITHUB_SHA} services/api
          docker build -t over-nerv-block-web:${GITHUB_SHA} -f apps/web/Dockerfile .

      - name: Scan API container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: over-nerv-block-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan web container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: over-nerv-block-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Upload failed browser report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7
