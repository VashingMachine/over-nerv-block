services:
  api:
    build:
      context: ./services/api
    environment:
      APP_COMMIT: local-container
      APP_ENV: local-container
      APP_VERSION: 0.1.0
      ALLOWED_ORIGINS: http://localhost:8080
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_BUILD_ID: local-container
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
